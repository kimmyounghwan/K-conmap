# 📋 내역서 문의 알림 (2026-09-15)
#
# 소장님: 「메일 알림으로 가자. 이게 제일 편하고 좋다.」
#
# 문의함(RTDB 의 quotes)은 «읽기 금지»로 잠가 두었습니다 — 공사 정보와 연락처가 들어가서
# 아무도 못 읽게 한 것입니다. 그래서 소장님도 사이트에서는 못 보십니다.
# 이 작업이 관리자 키로 읽어 **메일로 밀어 드립니다.** PC 가 꺼져 있어도 옵니다.
#
# ⚠️ 메일 계정(MAIL_USER·MAIL_PASS)이 없어도 **알림은 옵니다.**
#    그때는 이 작업이 «실패»로 끝나고 GitHub 가 실패 메일을 보냅니다. 모양만 거칠 뿐입니다.
#    Gmail 앱 비밀번호를 Secrets 에 넣으시면 제대로 된 메일로 바뀝니다.
#
# 🐛 2026-09-15 — 그 «거친 알림» 이 하루 144통이 됐습니다.
#    메일을 못 보내면 「보냈음」 표시를 못 붙여서 같은 문의로 10분마다 영원히 실패했습니다.
#    → 이제 한 문의당 **한 번만** 알리고(notified 표시), 그 뒤로는 조용히 넘어갑니다.
#    ⚠️ 그래서 그 «한 통» 안의 문의 내용을 꼭 갈무리해 두셔야 합니다.
name: 내역서 문의 알림

on:
  schedule:
    # 10분마다. GitHub 예약은 몇 분씩 늦을 수 있지만 문의는 그 정도면 충분합니다.
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: quote-mail
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 구글 인증 꾸러미
        run: python -m pip install --quiet google-auth

      - name: 문의함 확인하고 메일 보내기
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python tools/quote_mail.py
