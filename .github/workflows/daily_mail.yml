# 🪦 Daily Construction Bid Mailer — 멈추기 위한 파일입니다 (2026-09-15)
#
# 소장님: 「계속 메일이 건설맵 자동이 실패한다는 메일」
#
# ■ 무슨 일이 있었나
#   이 이름의 작업이 예전에 있었고, 파일은 저장소에서 사라졌습니다.
#   그런데 GitHub 에 «예약» 이 남아 지금도 옛 커밋(0a44302 — 지금은 저장소에 없는 커밋)으로
#   날마다 돌고 **매번 실패**했습니다. 2026-09-15 기준 61번(#66~#91).
#   Actions 화면에서는 「이 워크플로는 존재하지 않습니다」 라고 떠서 **끄는 단추도 없습니다.**
#
# ■ 그래서 이 파일이 있습니다
#   같은 이름·같은 경로로 «예약이 없는» 파일을 두면, GitHub 가 기본 가지에서 이 파일을 읽고
#   예약을 지웁니다. 그러면 실패 메일이 멈추고, 목록에도 나타나 손으로 끌 수 있습니다.
#
# ⚠️ 여기에 schedule 을 다시 넣지 마십시오. 넣는 순간 유령이 되살아납니다.
#    날마다 보내는 메일이 다시 필요하면 «새 이름» 으로 새 파일을 만드십시오.
name: Daily Construction Bid Mailer

on:
  workflow_dispatch:

jobs:
  tombstone:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 안내
        run: |
          echo "이 작업은 더 쓰지 않습니다."
          echo "옛 예약을 지우려고 남겨 둔 빈 껍데기입니다 — .github/workflows/daily_mail.yml 을 읽어 보세요."
