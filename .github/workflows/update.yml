# ============================================================
#  K-건설맵 자동 갱신
#
#  이 파일이 하는 일: 소장님 컴퓨터가 꺼져 있어도
#  GitHub 서버가 대신 조달청 자료를 받아 사이트에 올립니다.
#
#  한국시간 08:07~18:07 을 30분마다 돌고,
#  «Actions» 탭에서 손으로 즉시 돌릴 수도 있습니다.
#  실패하면 GitHub 이 소장님 메일로 알려줍니다.
# ============================================================
name: 사이트 자동 갱신

on:
  schedule:
    # 저장소를 공개로 바꿔 Actions 시간이 무제한 무료가 됐습니다.
    # 그래서 한국시간 08:07 ~ 18:07 을 «30분마다» 돕니다 (하루 21회).
    #
    # ⚠️ GitHub 예약 실행은 정시가 보장되지 않습니다. 실제로 밀린 기록:
    #    08:00 → 09:42 / 14:00 → 18:47 / 20:00 → 02:54
    #    그래서 분을 정각에서 비켜 :07 · :37 로 둡니다.
    #    한 번 밀려도 30분 뒤가 받으므로 «어제 자료»로 보이는 일이 없어집니다.
    #
    # UTC 기준입니다. 한국시간 = UTC + 9시간.
    - cron: '7,37 23,0-8 * * *'   # 한국 08:07 ~ 17:37 (30분마다)
    - cron: '7 9 * * *'           # 한국 18:07 — 그날 마지막
  workflow_dispatch:        # «Actions» 탭에서 손으로 돌리는 버튼

  # 화면(코드)을 고쳐서 올리면 그것도 바로 사이트에 반영되게 합니다.
  # 이게 없으면 «자료는 자동으로 바뀌는데 화면은 그대로» 인 상태가 됩니다.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '*.py'
      - '.github/workflows/update.yml'

# 같은 작업이 겹쳐 돌지 않게 (중복 배포 방지)
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write           # 누적 자료를 저장소에 다시 올리기 위해

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      # 수집 기록(data/store)은 저장소에 넣지 않고 여기에 보관합니다.
      # 매일 쓰므로 사라지지 않지만, 혹시 사라지면 아래에서 스스로 복구합니다.
      - name: 지난 수집 기록 가져오기
        uses: actions/cache@v4
        with:
          path: data/store
          key: store-${{ github.run_id }}
          restore-keys: store-

      - name: 조달청 수집
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'   # 진행 상황이 로그에 바로 찍히게 (없으면 멈춘 것처럼 보임)
        run: |
          # A값 소급 보충은 collect.py 가 «모자라면 스스로» 합니다.
          #   최근 45일 개찰 중 A값을 아는 비율이 60% 미만이면 자동 실행, 하루 한 번.
          #   그래서 아침까지 기다릴 필요 없이 다음 회차에서 바로 채워집니다.
          #
          # 30분마다 돌기 때문에 매번 3일치를 훑으면 조달청 호출이 21배가 됩니다.
          # 아침 첫 회차와 점심때만 3일치를 훑고, 나머지는 2일치만 가볍게 받습니다.
          # (2일치면 어제 늦게 올라온 개찰 결과도 놓치지 않습니다)
          if [ ! -s data/store/first.json ]; then
            echo "▶ 수집 기록이 없습니다 — 21일치를 받습니다"
            python collect.py --backfill 21
          else
            H=$(TZ=Asia/Seoul date +%H)
            if [ "$H" = "08" ] || [ "$H" = "13" ]; then
              echo "▶ 정밀 회차 — 3일치"
              python collect.py --days 3
            else
              echo "▶ 가벼운 회차 — 2일치"
              python collect.py --days 2
            fi
          fi

      # 진단 — 투찰업체 «전체»(1~10위)를 주는 오퍼레이션이 있는지 한 번 두드려 봅니다.
      # 지금 쓰는 개찰결과는 1순위만 돌려줍니다. 결과를 보고 되는 게 있으면 본수집에 붙입니다.
      # 자료를 바꾸지 않으므로 실패해도 그냥 넘어갑니다.
      - name: 진단 (투찰업체 목록 오퍼레이션 탐색)
        continue-on-error: true
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        # 30분마다 두드릴 이유가 없습니다. 아침 첫 회차에만 합니다.
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$H" = "08" ]; then python collect.py --probe; else echo "건너뜀"; fi

      - name: 3년치 집계
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: python build_json.py

      - name: 검색엔진 주소 목록
        env:
          PYTHONUTF8: '1'
        run: python sitemap.py

      - name: 사이트 빌드
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 사이트 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: k-conmap
          channelId: live
          entryPoint: web

      - name: 누적 자료 저장소에 반영
        run: |
          git config user.name  "k-conmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/extra_*.csv
          if git diff --staged --quiet; then
            echo "새로 쌓인 자료 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
