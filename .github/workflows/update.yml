# ============================================================
#  K-건설맵 자동 갱신
#
#  이 파일이 하는 일: 소장님 컴퓨터가 꺼져 있어도
#  GitHub 서버가 대신 조달청 자료를 받아 사이트에 올립니다.
#
#  한국시간 08:07~18:07 을 30분마다 돌고,
#  «Actions» 탭에서 손으로 즉시 돌릴 수도 있습니다.
#  실패하면 GitHub 이 소장님 메일로 알려줍니다.
# ============================================================
name: 사이트 자동 갱신

on:
  schedule:
    # ⚠️ 2026-09-04 — 「30분마다(하루 21회)」로 걸어 두었는데 **실제로는 하루 4회만 돌았습니다.**
    #    Actions 기록 실측:
    #      9/2  00:23 · 09:42 · 17:58 · 22:31
    #      9/3  10:03 · 14:40 · 20:04 · 22:29
    #      9/4  08:07·08:37 예약분 → 09:00 까지 한 번도 안 옴
    #    GitHub 은 예약 실행이 밀린 상태에서 다음 차례가 오면 **그 차례를 버립니다.**
    #    30분 간격 + 몇 시간씩 밀림 = 거의 전부 버려집니다. 촘촘하게 걸수록 오히려 덜 돕니다.
    #    → 간격을 2시간으로 벌립니다. 한 회차가 2시간 밀려도 다음 차례와 겹치지 않습니다.
    #
    # ⚠️ 2026-09-08 — 예약을 «아침에 몰았습니다». 이유:
    #    사슬(맨 아래 단계)이 생긴 뒤로는 **첫 회차만 걸리면** 저녁까지 알아서 이어집니다.
    #    그런데 예약을 하루 종일 퍼뜨려 두니, GitHub 이 하루 3번만 돌려주는 그 3번이
    #    하루 전체에 흩어져 «첫 회차»가 늦게 왔습니다. 실측한 첫 회차 시각:
    #      9/5 09:48 · 9/6 09:48 · 9/7 09:50 · 9/8 10:06
    #    개찰은 오전 11시에 69%가 몰리는데, 그 직전에야 시작한 것입니다.
    #    → 기회를 전부 이른 아침에 둡니다. 예약이 2시간쯤 밀려도 08~09시에는 걸립니다.
    #    오후 14:07 하나는 «보험» 입니다 — 사슬이 중간에 끊겼을 때 다시 시작시킵니다.
    #
    # 한국시간 06:07 · 07:07 · 08:07 · 09:07 · 14:07
    # 분은 계속 정각을 피합니다(:07) — 정각은 요청이 몰려 더 밀립니다.
    # UTC 기준입니다. 한국시간 = UTC + 9시간.
    - cron: '7 21,22,23,0,5 * * *'
  workflow_dispatch:        # «Actions» 탭에서 손으로 돌리는 버튼

  # 화면(코드)을 고쳐서 올리면 그것도 바로 사이트에 반영되게 합니다.
  # 이게 없으면 «자료는 자동으로 바뀌는데 화면은 그대로» 인 상태가 됩니다.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '*.py'
      - '.github/workflows/update.yml'

# 같은 작업이 겹쳐 돌지 않게 (중복 배포 방지)
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write           # 누적 자료를 저장소에 다시 올리기 위해
  actions: write            # 회차가 끝나면 «다음 회차» 를 스스로 부르기 위해 (2026-09-07)

jobs:
  update:
    runs-on: ubuntu-latest
    # 2026-09-07 — 맨 끝에 «다음 회차 부르기 전 25분 쉬기» 가 붙어서 45분으로는 모자랍니다.
    #   실측 회차 길이 8~35분 + 25분 = 최대 60분. 여유를 두어 80분.
    timeout-minutes: 80

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      # ══════════════════════════════════════════════════════════════
      # 🏷️ 화면 검사 — 굽기 «전에», 실패하면 배포까지 통째로 멈춥니다.
      #
      # ⚠️ 왜 «막는» 검사인가 (2026-09-17)
      #   공고 카드가 「추정가격」 이라 적고 **배정예산**(총사업비)을 찍고 있었습니다.
      #   8월 30일부터 18일간. 에러도 안 나고 숫자도 그럴듯해서 아무도 못 봤습니다.
      #   실측 15,251건 중 15,168건(99.5%)이 다른 숫자였고, 2,085건(13.7%)은
      #   2·3·4·10·50·100억 **법정 경계를 넘어** 다른 칸으로 보였습니다.
      #   ⚠️ 「배정예산을 추정가격으로 쓰면 안 된다」는 **주석이 이미 있었습니다.**
      #      사람이 기억하는 것으로는 못 막습니다. 기계가 막아야 합니다.
      #
      #   막는 쪽을 고른 까닭: 안 막으면 «빨간불이 떠 있는데 계속 배포되는» 상태가 되고,
      #   그건 아무도 안 봅니다. 한 회차(25분) 늦는 것이 18일 틀린 것보다 낫습니다.
      # ⚠️ 다만 8절 22 — **틀린 경보 하나가 배포를 통째로 멈춘 적이 있습니다.**
      #   그래서 두 검사 모두 «자가시험»(일부러 틀린 것을 넣어 잡히는지)을 먼저 돌립니다.
      #   검사 자체가 깨지면 그 자리에서 알려 줍니다.
      # ══════════════════════════════════════════════════════════════
      - name: 화면 검사 (import · 이름표↔숫자 · 운영자 목록)
        env:
          PYTHONUTF8: '1'
        run: |
          python tools/checkimports.py
          python tools/checklabels.py
          python tools/checkops.py

      # 수집 기록(data/store)은 저장소에 넣지 않고 여기에 보관합니다.
      # 매일 쓰므로 사라지지 않지만, 혹시 사라지면 아래에서 스스로 복구합니다.
      - name: 지난 수집 기록 가져오기
        uses: actions/cache@v4
        with:
          path: data/store
          key: store-${{ github.run_id }}
          restore-keys: store-

      - name: 조달청 수집
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'   # 진행 상황이 로그에 바로 찍히게 (없으면 멈춘 것처럼 보임)
        run: |
          # A값 소급 보충은 collect.py 가 «모자라면 스스로» 합니다.
          #   최근 45일 개찰 중 A값을 아는 비율이 60% 미만이면 자동 실행, 하루 한 번.
          #   그래서 아침까지 기다릴 필요 없이 다음 회차에서 바로 채워집니다.
          #
          # ⚠️ 2026-09-04 — 전에는 «한국시간 08시·13시면 3일치, 아니면 2일치» 였습니다.
          #    GitHub 예약이 정시에 안 오므로 시각으로 갈라 봐야 소용이 없었습니다
          #    (08시·13시에 걸린 회차가 거의 없어 사실상 늘 2일치였습니다).
          #    회차가 하루 21번에서 6번으로 줄었으니 매번 3일치를 훑습니다.
          #    6회 × 3일치는 전에 계획한 21회 × 2일치보다 조달청 호출이 훨씬 적습니다.
          if [ ! -s data/store/first.json ]; then
            echo "▶ 수집 기록이 없습니다 — 21일치를 받습니다"
            python collect.py --backfill 21
          else
            python collect.py --days 3
          fi

      # 진단 — 투찰업체 «전체»(1~10위)를 주는 오퍼레이션이 있는지 한 번 두드려 봅니다.
      # 지금 쓰는 개찰결과는 1순위만 돌려줍니다. 결과를 보고 되는 게 있으면 본수집에 붙입니다.
      # 자료를 바꾸지 않으므로 실패해도 그냥 넘어갑니다.
      - name: 진단 (투찰업체 목록 오퍼레이션 탐색)
        continue-on-error: true
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        # 하루 6회이므로 매 회차에 해도 부담이 없습니다.
        # (시각으로 «아침 첫 회차»를 고르던 방식은 예약이 밀려 거의 안 걸렸습니다)
        run: python collect.py --probe

      - name: 3년치 집계
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: python build_json.py

      - name: 검색엔진 주소 목록
        env:
          PYTHONUTF8: '1'
        run: python sitemap.py

      - name: 사이트 빌드
        working-directory: web
        run: |
          npm ci
          npm run build

      # 📊 2026-09-19 — 소장님: 「내가 업체만 선택하면 나오게 해줘」
      #   성적표 만들기(/report/make)는 개찰 자료(first.json)가 있어야 «떨어진 것» 까지 나옵니다.
      #   전에는 소장님이 컴퓨터에서 그 파일을 «직접 골라야» 했고, 안 고르면 3년치 낙찰만 담긴
      #   3쪽짜리가 나왔습니다(견본은 7쪽인데). → 배포할 때 사이트에 같이 싣습니다.
      #   ⚠️ 반드시 빌드 «뒤» 입니다 — npm run build 가 dist 를 비웁니다.
      #   ⚠️ 자료 자체는 조달청이 공개한 개찰 결과입니다(사이트가 이미 업체별로 보여 주는 것과 같은 것).
      - name: 성적표용 개찰 자료 싣기
        continue-on-error: true
        run: |
          mkdir -p web/dist/data
          cp data/store/first.json web/dist/data/first_full.json
          ls -la web/dist/data/first_full.json

      # ★ 2026-09-04 — 주소마다 «진짜 HTML» 을 굽습니다.
      #   그전까지는 어떤 주소를 요청해도 서버가 똑같은 2,161바이트 빈 껍데기를 줬습니다.
      #   구글에는 «제목·설명·본문이 전부 같은 페이지» 로 보이고, 네이버(자바스크립트를
      #   거의 안 돌립니다)에는 아예 빈 페이지였습니다. 카톡 미리보기도 전부 같았습니다.
      #   ⚠️ 반드시 빌드 «뒤», 배포 «앞» 입니다 — npm run build 가 dist 를 비웁니다.
      #   실패해도 배포는 계속합니다(사이트가 안 뜨는 것보다 낫습니다).
      - name: 주소별 HTML 굽기
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
        run: python prerender.py

      - name: 사이트 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: k-conmap
          channelId: live
          entryPoint: web

      # ══════════════════════════════════════════════════════════════
      # 📊 3년치 «떨어진 기록» 메우기 (2026-09-18)
      #
      #   소장님: 「3년 동안 낙찰이 없는 업체도 되는 거지?」
      #   투찰업체 «전부» 가 있는 자료는 2026-07-14 부터입니다 —
      #   first.json 이 70일만 두기 때문입니다. 3년 파일에는 1순위만 적혀 있어
      #   (118,847줄 중 두 곳 이상 든 줄 64줄) 떨어진 기록이 없었습니다.
      #   2026-09-18 실측 — 조달청은 «옛 공고번호» 로도 개찰 순위를 줍니다.
      #   → 가진 공고번호 106,221건을 회차마다 조금씩 물어 메웁니다.
      #
      #   ⚠️ 반드시 «배포 뒤» 입니다. 늦어도 사이트에는 아무 영향이 없습니다.
      #   ⚠️ 하루 몫이 끝나거나 시간 예산을 넘기면 조용히 멈추고 다음 회차가 이어받습니다.
      #   ⚠️ 실패해도 회차를 죽이지 않습니다 (continue-on-error).
      # ══════════════════════════════════════════════════════════════
      - name: 3년치 메우기 (남는 몫만큼)
        continue-on-error: true
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        run: python tools/메우기3년.py --건수 4000 --시간예산 480

      - name: 누적 자료 저장소에 반영
        run: |
          git config user.name  "k-conmap-bot"
          git config user.email "actions@users.noreply.github.com"
          # data/seed 도 함께 — collect.py 가 주 1회 다시 구운 «복구용 씨앗» 입니다.
          # 이걸 커밋하지 않으면 캐시가 날아갔을 때 옛 씨앗으로 되돌아가 며칠이 사라집니다
          # (2026-09-12 확인: 씨앗이 09-03 에 9일째 멈춰 있었습니다).
          # 📋 회차 상태 한 장 — 밖에서 git 만으로 «어디까지 왔나» 를 볼 수 있게 (2026-09-15)
          #    Actions 로그는 저장소가 아니라서 인증 없이는 못 읽습니다.
          BR="${{ github.ref_name }}"
          git add data/extra_*.csv data/seed "docs/수집상태.md"
          if git diff --staged --quiet; then
            echo "새로 쌓인 자료 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            # ══════════════════════════════════════════════════════════
            # 🐛 2026-09-15 — 여기서 하루 내내 빨간불이 났습니다 (exit 128).
            #
            #     CONFLICT (content): Merge conflict in docs/수집상태.md
            #     error: could not apply fb48091... 자동 수집 …
            #     fatal: You are not currently on a branch.
            #
            #   원인: 「git pull --rebase … || true」 였습니다. 충돌이 나도 «|| true» 가
            #   실패를 삼켜 버려, 저장소가 **리베이스 중간(가지 밖)** 인 채로 남고
            #   바로 다음 git push 가 「지금 가지 위에 있지 않습니다」로 죽었습니다.
            #   부딪힌 파일은 docs/수집상태.md — 회차마다 «통째로 다시 쓰는» 파일이라
            #   두 회차가 겹치거나 사람이 그 사이에 올리면 반드시 충돌합니다.
            #
            #   → ① 충돌하면 기계가 쓰는 파일은 «이번 회차 것» 으로 밀고 갑니다
            #        (리베이스 중에는 --theirs 가 내가 방금 만든 커밋입니다)
            #     ② 밀려나면(누가 먼저 올렸으면) 다시 받아서 세 번까지 시도합니다
            #     ③ 그래도 안 되면 **리베이스를 되돌리고 경고만** 냅니다.
            #        자료는 캐시에 남아 다음 회차가 다시 올립니다 —
            #        이걸로 빨간불을 내면 «고칠 것도 없는 메일» 만 쌓입니다.
            #        정말로 수집이 멈춘 것은 아래 「수집 상태 확인」 이 따로 봅니다.
            # ══════════════════════════════════════════════════════════
            pushed=0
            for i in 1 2 3; do
              git fetch origin "$BR" || true
              if ! git rebase --autostash "origin/$BR"; then
                # ⚠️ 여러 경로를 한 번에 주면 «충돌 안 한 파일» 하나 때문에 git 이 통째로 거부하고
                #    아무것도 안 고칩니다 — 그러면 충돌 표시(<<<<<<<)가 그대로 커밋됩니다.
                #    (2026-09-15 시험에서 실제로 그렇게 들어갔습니다)
                #    → 충돌한 파일만 골라 «하나씩» 되돌립니다.
                git diff --name-only --diff-filter=U -z | while IFS= read -r -d '' f; do
                  git checkout --theirs -- "$f" 2>/dev/null || git checkout --ours -- "$f" 2>/dev/null || true
                  git add -- "$f"
                done
                # 그래도 충돌 표시가 남았으면 올리지 않습니다 — 틀린 파일을 올리느니 거릅니다
                if git grep -qI -e '^<<<<<<< ' -e '^>>>>>>> ' -- . 2>/dev/null; then
                  git rebase --abort 2>/dev/null || true
                  echo "::warning::충돌 표시가 남아 이번 회차는 올리지 않습니다 — 다음 회차가 이어받습니다"
                  break
                fi
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort 2>/dev/null || true
                  echo "::warning::리베이스를 못 마쳤습니다 — 다음 회차가 이어받습니다"
                  break
                fi
              fi
              if git push origin "HEAD:$BR"; then pushed=1; break; fi
              echo "밀려났습니다 — 다시 받아서 시도합니다 ($i/3)"
              sleep $((10 * i))
            done
            if [ "$pushed" != 1 ]; then
              git rebase --abort 2>/dev/null || true
              echo "::warning::이번 회차 자료 커밋을 못 올렸습니다. 자료는 캐시에 남아 있고 다음 회차가 다시 올립니다."
            fi
          fi

      # ══════════════════════════════════════════════════════════════
      # 이번 회차가 «제 일을 했나» — collect.py 가 적어 둔 health.json 을 봅니다
      #
      #   2026-09-07 의 구멍: 조달청 연결이 안 돼 한 줄도 못 받았는데
      #   collect.py 는 정상 종료하고, 집계·빌드·배포는 그대로 돌아서
      #   **초록 체크가 뜨고 메일도 안 왔습니다.** 자료만 5시간 멈췄습니다.
      #   → 이제 여기서 «받았는가» 를 직접 보고, 두 번 연속 비면 일부러 빨간불을 냅니다
      #     (GitHub 이 실패한 워크플로를 메일로 알려줍니다 — 비밀키가 따로 필요 없습니다).
      #   ⚠️ 배포 «뒤» 에 둡니다. 수집이 실패해도 사이트는 올려야 하니까요.
      # ══════════════════════════════════════════════════════════════
      - name: 수집 상태 확인
        id: health
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          ok, fails, why = 0, 1, "수집 단계를 마치지 못했습니다"
          try:
              h = json.load(open("data/store/health.json", encoding="utf-8"))
              at = datetime.datetime.strptime(h["at"], "%Y-%m-%d %H:%M")
              now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              # 이번 회차가 쓴 게 맞는지 (collect.py 가 터지면 지난 회차 것이 남아 있습니다)
              if (now - at).total_seconds() > 3600:
                  fails = int(h.get("fails") or 0) + 1
                  why = "이번 회차가 상태를 기록하지 못했습니다 (기록 시각 %s)" % h["at"]
              else:
                  ok = 1 if h.get("ok") else 0
                  fails = int(h.get("fails") or 0)
                  why = h.get("why") or ""
          except Exception as e:
              why = "상태 파일을 읽지 못했습니다 (%s)" % type(e).__name__
          print("ok=%d" % ok)
          print("fails=%d" % fails)
          print("why=%s" % why.replace("\n", " "))
          import sys
          print("== 수집 상태: %s / 연속 실패 %d회 / %s" % ("정상" if ok else "실패", fails, why or "-"),
                file=sys.stderr)
          PY

      - name: 연속 실패 알림 (빨간불 = 메일)
        if: ${{ !cancelled() && steps.health.outputs.fails >= 2 }}
        run: |
          # ⚠️ 2026-09-07 밤 — 밤에는 메일을 보내지 않습니다. 그 시간엔 새로 나오는 것이 없어
          #    «실패» 메일이 가면 놀라기만 하고 할 수 있는 일이 없습니다.
          #
          # ⚠️ 2026-09-12 — **주말 제외를 뺐습니다.** 소장님: 「토·일도 공고는 나오거든.」
          #    실측 7주치: 공고 토 45건 · 일 31건 (개찰만 주말에 사실상 없습니다 — 토 1 · 일 0).
          #    그런데 사슬은 주말에도 06~19시에 돕니다. 그래서 토요일에 수집이 멈추면
          #    **메일도 안 오고 화면도 조용해서 월요일까지 아무도 몰랐습니다.**
          #    → 요일 조건을 없애고, 시작 시각도 사슬과 같은 06시로 맞춥니다.
          #      (화면 경고도 같이 고쳤습니다 — web/src/Fresh.jsx 의 working)
          H=$((10#$(TZ=Asia/Seoul date +%H)))
          if [ "$H" -lt 6 ] || [ "$H" -ge 19 ]; then
            echo "한국시간 $(TZ=Asia/Seoul date '+%m-%d(%a) %H:%M') — 갱신이 도는 시간이 아니라 메일은 보내지 않습니다."
            echo "연속 ${{ steps.health.outputs.fails }}회 비었습니다: ${{ steps.health.outputs.why }}"
            exit 0
          fi
          echo "::error::조달청 수집이 ${{ steps.health.outputs.fails }}회 연속 비었습니다 — ${{ steps.health.outputs.why }}"
          echo ""
          echo "  이 빨간불은 «사이트가 죽었다» 가 아닙니다."
          echo "  사이트는 그대로 뜨지만, 새 공고·개찰이 안 들어오고 있다는 뜻입니다."
          echo "  대부분 조달청 쪽 일시 장애입니다 — 다음 회차(5분 뒤)가 스스로 다시 시도합니다."
          exit 1

      # ══════════════════════════════════════════════════════════════
      # 다음 회차를 스스로 부른다 — GitHub 예약이 하루 3번밖에 안 돌아서 (2026-09-07)
      #
      #   예약(cron)을 몇 번 걸든 실제로는 하루 3번쯤만 돕니다 (실측, 예약 회차만):
      #     9/5  09:48 · 14:33 · 20:13
      #     9/6  09:48 · 14:46 · 20:36
      #     9/7  09:50 · 14:56 · (16:07 예약분은 17:50 까지 안 옴)
      #   30분 간격(21회)으로 걸었을 때는 4번, 2시간 간격(6회)으로 걸어도 3번.
      #   → 간격의 문제가 아니라 **무료 공개 저장소의 예약 실행을 GitHub 이 이만큼만 돌려 주는 것** 입니다.
      #   그래서 오늘 14:56 회차가 조달청 연결 실패로 비자, 다음 회차(20시대)까지 5시간 넘게 멈췄습니다.
      #
      #   손으로 누르는 「Run workflow」(workflow_dispatch)는 예약과 달리 **바로** 돕니다.
      #   그리고 GitHub 규칙상 GITHUB_TOKEN 이 일으킨 사건은 새 실행을 못 만들지만
      #   workflow_dispatch 와 repository_dispatch 는 **예외** 입니다.
      #   → 회차가 끝날 때 25분 쉬고 스스로 다음 회차를 부릅니다. 비밀키가 따로 필요 없습니다.
      #
      #   ■ 안전장치
      #     · 한국시간 06~19시에만 잇습니다. 19시가 넘으면 사슬이 끊기고, 다음 아침 예약분이 다시 시작합니다.
      #     · 이미 «기다리는 실행» 이 있거나 «나 말고 도는 실행» 이 있으면 부르지 않습니다 — 사슬이 두 갈래로
      #       갈라지지 않게 (예약분·푸시분이 끼어들어도 한 줄로 유지됩니다).
      #     · concurrency(group: update) 가 있어 어차피 동시에 두 개는 안 돕니다.
      #     · 회차 길이 ~20분 + 25분 = 약 45분마다 한 번. 3일치 × 하루 13회 ≈ 예전 2일치 × 21회와 비슷한 호출량.
      #   ■ 끄는 법
      #     저장소 변수(Settings → Variables) 에 CHAIN_OFF=1 을 만들면 이 단계가 아무것도 안 합니다.
      # ══════════════════════════════════════════════════════════════
      - name: 다음 회차 예약 (25분 뒤)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_OFF: ${{ vars.CHAIN_OFF }}
        run: |
          if [ "${CHAIN_OFF:-0}" = "1" ]; then
            echo "CHAIN_OFF=1 — 다음 회차를 부르지 않습니다"; exit 0
          fi
          H=$((10#$(TZ=Asia/Seoul date +%H)))   # «08» 같은 앞자리 0 을 십진수로
          # ⚠️ 아래를 08 로 두면, 예약이 제때 와서 06~07시에 도는 회차가
          #    사슬을 못 잇고 그냥 끝나 버립니다. 예약 시각과 반드시 같이 움직여야 합니다.
          if [ "$H" -lt 6 ] || [ "$H" -ge 19 ]; then
            echo "한국시간 ${H}시 — 06~19시 밖이라 사슬을 잇지 않습니다"; exit 0
          fi
          # ⚠️ 2026-09-07 실측 — «--status queued» 만 보면 놓칩니다.
          #    동시성(concurrency: update)에 막혀 차례를 기다리는 회차를 GitHub 은
          #    «queued» 가 아니라 «pending» 으로 표시합니다. 그래서 실제로 대기 중이던
          #    #132 를 「기다리는 실행 0개」로 읽고 한 번 더 불렀고, 새로 부른 #133 이
          #    들어오면서 **#132 가 취소됐습니다.** (자료는 안 틀어집니다 — #133 이 같은
          #    커밋을 돌립니다. 하지만 회차 하나를 헛되이 버린 것입니다)
          busy() {
            J=$(gh run list --workflow update.yml --limit 20 --json status)
            Q=$(echo "$J" | jq '[.[]|select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")]|length')
            P=$(echo "$J" | jq '[.[]|select(.status=="in_progress")]|length')
            echo "기다리는 실행 ${Q}개 · 도는 실행 ${P}개(나 포함)"
            [ "${Q:-0}" -gt 0 ] || [ "${P:-1}" -gt 1 ]
          }
          if busy; then
            echo "이미 다른 회차가 잡혀 있습니다 — 부르지 않습니다"; exit 0
          fi
          # 조달청에서 한 줄도 못 받은 회차면 25분이 아니라 5분 뒤에 다시 부릅니다.
          # ⚠️ 다만 3회까지만 서두릅니다. 조달청이 몇 시간 죽어 있을 때
          #    5분마다 두드리면 호출 한도만 태웁니다 (실제 장애는 대개 한 시간짜리였습니다).
          W=1500
          if [ "${{ steps.health.outputs.ok }}" != "1" ]; then
            if [ "${{ steps.health.outputs.fails }}" -le 3 ] 2>/dev/null; then
              W=300
              echo "이번 회차는 조달청에서 한 줄도 못 받았습니다 (연속 ${{ steps.health.outputs.fails }}회) — 5분 뒤에 다시 부릅니다"
            else
              echo "연속 ${{ steps.health.outputs.fails }}회째 비었습니다 — 조달청 쪽 장애로 보고 평소 간격(25분)으로 돌아갑니다"
            fi
          fi
          echo "${W} 초 뒤 다음 회차를 부릅니다 (한국시간 $(TZ=Asia/Seoul date '+%H:%M') 기준)"
          sleep "$W"
          # 자는 25분 사이에 소장님이 코드를 올리셨을 수 있습니다. 그때 그냥 부르면
          # 새로 들어온 회차가 «기다리던 그 회차»를 취소시킵니다. 그래서 한 번 더 봅니다.
          if busy; then
            echo "자는 동안 다른 회차가 잡혔습니다 — 부르지 않습니다"; exit 0
          fi
          gh workflow run update.yml --ref "${{ github.ref_name }}" && echo "▶ 다음 회차를 불렀습니다"
