# ============================================================
#  K-건설맵 자동 갱신
#
#  이 파일이 하는 일: 소장님 컴퓨터가 꺼져 있어도
#  GitHub 서버가 대신 조달청 자료를 받아 사이트에 올립니다.
#
#  한국시간 08:07~18:07 을 30분마다 돌고,
#  «Actions» 탭에서 손으로 즉시 돌릴 수도 있습니다.
#  실패하면 GitHub 이 소장님 메일로 알려줍니다.
# ============================================================
name: 사이트 자동 갱신

on:
  schedule:
    # ⚠️ 2026-09-04 — 「30분마다(하루 21회)」로 걸어 두었는데 **실제로는 하루 4회만 돌았습니다.**
    #    Actions 기록 실측:
    #      9/2  00:23 · 09:42 · 17:58 · 22:31
    #      9/3  10:03 · 14:40 · 20:04 · 22:29
    #      9/4  08:07·08:37 예약분 → 09:00 까지 한 번도 안 옴
    #    GitHub 은 예약 실행이 밀린 상태에서 다음 차례가 오면 **그 차례를 버립니다.**
    #    30분 간격 + 몇 시간씩 밀림 = 거의 전부 버려집니다. 촘촘하게 걸수록 오히려 덜 돕니다.
    #    → 간격을 2시간으로 벌립니다. 한 회차가 2시간 밀려도 다음 차례와 겹치지 않습니다.
    #
    # 한국시간 08:07 · 10:07 · 12:07 · 14:07 · 16:07 · 18:07 (하루 6회)
    # 분은 계속 정각을 피합니다(:07) — 정각은 요청이 몰려 더 밀립니다.
    # UTC 기준입니다. 한국시간 = UTC + 9시간.
    - cron: '7 23,1,3,5,7,9 * * *'
  workflow_dispatch:        # «Actions» 탭에서 손으로 돌리는 버튼

  # 화면(코드)을 고쳐서 올리면 그것도 바로 사이트에 반영되게 합니다.
  # 이게 없으면 «자료는 자동으로 바뀌는데 화면은 그대로» 인 상태가 됩니다.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '*.py'
      - '.github/workflows/update.yml'

# 같은 작업이 겹쳐 돌지 않게 (중복 배포 방지)
concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write           # 누적 자료를 저장소에 다시 올리기 위해
  actions: write            # 회차가 끝나면 «다음 회차» 를 스스로 부르기 위해 (2026-09-07)

jobs:
  update:
    runs-on: ubuntu-latest
    # 2026-09-07 — 맨 끝에 «다음 회차 부르기 전 25분 쉬기» 가 붙어서 45분으로는 모자랍니다.
    #   실측 회차 길이 8~35분 + 25분 = 최대 60분. 여유를 두어 80분.
    timeout-minutes: 80

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      # 수집 기록(data/store)은 저장소에 넣지 않고 여기에 보관합니다.
      # 매일 쓰므로 사라지지 않지만, 혹시 사라지면 아래에서 스스로 복구합니다.
      - name: 지난 수집 기록 가져오기
        uses: actions/cache@v4
        with:
          path: data/store
          key: store-${{ github.run_id }}
          restore-keys: store-

      - name: 조달청 수집
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'   # 진행 상황이 로그에 바로 찍히게 (없으면 멈춘 것처럼 보임)
        run: |
          # A값 소급 보충은 collect.py 가 «모자라면 스스로» 합니다.
          #   최근 45일 개찰 중 A값을 아는 비율이 60% 미만이면 자동 실행, 하루 한 번.
          #   그래서 아침까지 기다릴 필요 없이 다음 회차에서 바로 채워집니다.
          #
          # ⚠️ 2026-09-04 — 전에는 «한국시간 08시·13시면 3일치, 아니면 2일치» 였습니다.
          #    GitHub 예약이 정시에 안 오므로 시각으로 갈라 봐야 소용이 없었습니다
          #    (08시·13시에 걸린 회차가 거의 없어 사실상 늘 2일치였습니다).
          #    회차가 하루 21번에서 6번으로 줄었으니 매번 3일치를 훑습니다.
          #    6회 × 3일치는 전에 계획한 21회 × 2일치보다 조달청 호출이 훨씬 적습니다.
          if [ ! -s data/store/first.json ]; then
            echo "▶ 수집 기록이 없습니다 — 21일치를 받습니다"
            python collect.py --backfill 21
          else
            python collect.py --days 3
          fi

      # 진단 — 투찰업체 «전체»(1~10위)를 주는 오퍼레이션이 있는지 한 번 두드려 봅니다.
      # 지금 쓰는 개찰결과는 1순위만 돌려줍니다. 결과를 보고 되는 게 있으면 본수집에 붙입니다.
      # 자료를 바꾸지 않으므로 실패해도 그냥 넘어갑니다.
      - name: 진단 (투찰업체 목록 오퍼레이션 탐색)
        continue-on-error: true
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
        # 하루 6회이므로 매 회차에 해도 부담이 없습니다.
        # (시각으로 «아침 첫 회차»를 고르던 방식은 예약이 밀려 거의 안 걸렸습니다)
        run: python collect.py --probe

      - name: 3년치 집계
        env:
          PYTHONUTF8: '1'
          PYTHONUNBUFFERED: '1'
        run: python build_json.py

      - name: 검색엔진 주소 목록
        env:
          PYTHONUTF8: '1'
        run: python sitemap.py

      - name: 사이트 빌드
        working-directory: web
        run: |
          npm ci
          npm run build

      # ★ 2026-09-04 — 주소마다 «진짜 HTML» 을 굽습니다.
      #   그전까지는 어떤 주소를 요청해도 서버가 똑같은 2,161바이트 빈 껍데기를 줬습니다.
      #   구글에는 «제목·설명·본문이 전부 같은 페이지» 로 보이고, 네이버(자바스크립트를
      #   거의 안 돌립니다)에는 아예 빈 페이지였습니다. 카톡 미리보기도 전부 같았습니다.
      #   ⚠️ 반드시 빌드 «뒤», 배포 «앞» 입니다 — npm run build 가 dist 를 비웁니다.
      #   실패해도 배포는 계속합니다(사이트가 안 뜨는 것보다 낫습니다).
      - name: 주소별 HTML 굽기
        continue-on-error: true
        env:
          PYTHONUTF8: '1'
        run: python prerender.py

      - name: 사이트 배포
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: k-conmap
          channelId: live
          entryPoint: web

      - name: 누적 자료 저장소에 반영
        run: |
          git config user.name  "k-conmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/extra_*.csv
          if git diff --staged --quiet; then
            echo "새로 쌓인 자료 없음 — 커밋 생략"
          else
            git commit -m "자동 수집 $(date -u -d '+9 hours' '+%Y-%m-%d %H:%M') KST"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      # ══════════════════════════════════════════════════════════════
      # 이번 회차가 «제 일을 했나» — collect.py 가 적어 둔 health.json 을 봅니다
      #
      #   2026-09-07 의 구멍: 조달청 연결이 안 돼 한 줄도 못 받았는데
      #   collect.py 는 정상 종료하고, 집계·빌드·배포는 그대로 돌아서
      #   **초록 체크가 뜨고 메일도 안 왔습니다.** 자료만 5시간 멈췄습니다.
      #   → 이제 여기서 «받았는가» 를 직접 보고, 두 번 연속 비면 일부러 빨간불을 냅니다
      #     (GitHub 이 실패한 워크플로를 메일로 알려줍니다 — 비밀키가 따로 필요 없습니다).
      #   ⚠️ 배포 «뒤» 에 둡니다. 수집이 실패해도 사이트는 올려야 하니까요.
      # ══════════════════════════════════════════════════════════════
      - name: 수집 상태 확인
        id: health
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, datetime
          ok, fails, why = 0, 1, "수집 단계를 마치지 못했습니다"
          try:
              h = json.load(open("data/store/health.json", encoding="utf-8"))
              at = datetime.datetime.strptime(h["at"], "%Y-%m-%d %H:%M")
              now = datetime.datetime.utcnow() + datetime.timedelta(hours=9)
              # 이번 회차가 쓴 게 맞는지 (collect.py 가 터지면 지난 회차 것이 남아 있습니다)
              if (now - at).total_seconds() > 3600:
                  fails = int(h.get("fails") or 0) + 1
                  why = "이번 회차가 상태를 기록하지 못했습니다 (기록 시각 %s)" % h["at"]
              else:
                  ok = 1 if h.get("ok") else 0
                  fails = int(h.get("fails") or 0)
                  why = h.get("why") or ""
          except Exception as e:
              why = "상태 파일을 읽지 못했습니다 (%s)" % type(e).__name__
          print("ok=%d" % ok)
          print("fails=%d" % fails)
          print("why=%s" % why.replace("\n", " "))
          import sys
          print("== 수집 상태: %s / 연속 실패 %d회 / %s" % ("정상" if ok else "실패", fails, why or "-"),
                file=sys.stderr)
          PY

      - name: 연속 실패 알림 (빨간불 = 메일)
        if: ${{ !cancelled() && steps.health.outputs.fails >= 2 }}
        run: |
          echo "::error::조달청 수집이 ${{ steps.health.outputs.fails }}회 연속 비었습니다 — ${{ steps.health.outputs.why }}"
          echo ""
          echo "  이 빨간불은 «사이트가 죽었다» 가 아닙니다."
          echo "  사이트는 그대로 뜨지만, 새 공고·개찰이 안 들어오고 있다는 뜻입니다."
          echo "  대부분 조달청 쪽 일시 장애입니다 — 다음 회차(5분 뒤)가 스스로 다시 시도합니다."
          exit 1

      # ══════════════════════════════════════════════════════════════
      # 다음 회차를 스스로 부른다 — GitHub 예약이 하루 3번밖에 안 돌아서 (2026-09-07)
      #
      #   예약(cron)을 몇 번 걸든 실제로는 하루 3번쯤만 돕니다 (실측, 예약 회차만):
      #     9/5  09:48 · 14:33 · 20:13
      #     9/6  09:48 · 14:46 · 20:36
      #     9/7  09:50 · 14:56 · (16:07 예약분은 17:50 까지 안 옴)
      #   30분 간격(21회)으로 걸었을 때는 4번, 2시간 간격(6회)으로 걸어도 3번.
      #   → 간격의 문제가 아니라 **무료 공개 저장소의 예약 실행을 GitHub 이 이만큼만 돌려 주는 것** 입니다.
      #   그래서 오늘 14:56 회차가 조달청 연결 실패로 비자, 다음 회차(20시대)까지 5시간 넘게 멈췄습니다.
      #
      #   손으로 누르는 「Run workflow」(workflow_dispatch)는 예약과 달리 **바로** 돕니다.
      #   그리고 GitHub 규칙상 GITHUB_TOKEN 이 일으킨 사건은 새 실행을 못 만들지만
      #   workflow_dispatch 와 repository_dispatch 는 **예외** 입니다.
      #   → 회차가 끝날 때 25분 쉬고 스스로 다음 회차를 부릅니다. 비밀키가 따로 필요 없습니다.
      #
      #   ■ 안전장치
      #     · 한국시간 08~19시에만 잇습니다. 19시가 넘으면 사슬이 끊기고, 다음 아침 예약분이 다시 시작합니다.
      #     · 이미 «기다리는 실행» 이 있거나 «나 말고 도는 실행» 이 있으면 부르지 않습니다 — 사슬이 두 갈래로
      #       갈라지지 않게 (예약분·푸시분이 끼어들어도 한 줄로 유지됩니다).
      #     · concurrency(group: update) 가 있어 어차피 동시에 두 개는 안 돕니다.
      #     · 회차 길이 ~20분 + 25분 = 약 45분마다 한 번. 3일치 × 하루 13회 ≈ 예전 2일치 × 21회와 비슷한 호출량.
      #   ■ 끄는 법
      #     저장소 변수(Settings → Variables) 에 CHAIN_OFF=1 을 만들면 이 단계가 아무것도 안 합니다.
      # ══════════════════════════════════════════════════════════════
      - name: 다음 회차 예약 (25분 뒤)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_OFF: ${{ vars.CHAIN_OFF }}
        run: |
          if [ "${CHAIN_OFF:-0}" = "1" ]; then
            echo "CHAIN_OFF=1 — 다음 회차를 부르지 않습니다"; exit 0
          fi
          H=$((10#$(TZ=Asia/Seoul date +%H)))   # «08» 같은 앞자리 0 을 십진수로
          if [ "$H" -lt 8 ] || [ "$H" -ge 19 ]; then
            echo "한국시간 ${H}시 — 08~19시 밖이라 사슬을 잇지 않습니다"; exit 0
          fi
          Q=$(gh run list --workflow update.yml --status queued --json databaseId -q 'length')
          P=$(gh run list --workflow update.yml --status in_progress --json databaseId -q 'length')
          echo "기다리는 실행 ${Q}개 · 도는 실행 ${P}개(나 포함)"
          if [ "${Q:-0}" -gt 0 ] || [ "${P:-1}" -gt 1 ]; then
            echo "이미 다른 회차가 잡혀 있습니다 — 부르지 않습니다"; exit 0
          fi
          # 조달청에서 한 줄도 못 받은 회차면 25분이 아니라 5분 뒤에 다시 부릅니다.
          # ⚠️ 다만 3회까지만 서두릅니다. 조달청이 몇 시간 죽어 있을 때
          #    5분마다 두드리면 호출 한도만 태웁니다 (실제 장애는 대개 한 시간짜리였습니다).
          W=1500
          if [ "${{ steps.health.outputs.ok }}" != "1" ]; then
            if [ "${{ steps.health.outputs.fails }}" -le 3 ] 2>/dev/null; then
              W=300
              echo "이번 회차는 조달청에서 한 줄도 못 받았습니다 (연속 ${{ steps.health.outputs.fails }}회) — 5분 뒤에 다시 부릅니다"
            else
              echo "연속 ${{ steps.health.outputs.fails }}회째 비었습니다 — 조달청 쪽 장애로 보고 평소 간격(25분)으로 돌아갑니다"
            fi
          fi
          echo "${W} 초 뒤 다음 회차를 부릅니다 (한국시간 $(TZ=Asia/Seoul date '+%H:%M') 기준)"
          sleep "$W"
          gh workflow run update.yml --ref "${{ github.ref_name }}" && echo "▶ 다음 회차를 불렀습니다"
